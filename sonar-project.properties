sonar.projectKey=tinchodimarco_Juego-del-Ahorcado
sonar.organization=tinchodimarco

# Carpeta donde está el código a analizar (. = todo el proyecto)
sonar.sources=.

# Exclusiones recomendadas para que no analice tests o librerías externas
sonar.exclusions=**/node_modules/**,**/venv/**,**/__pycache__/**,**/tests/**
sonar.sourceEncoding=UTF-8
sonar.python.coverage.reportPaths=coverage.xml
