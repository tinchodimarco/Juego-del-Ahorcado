name: Análisis Estático de Código (SonarQube)

on:
  push:
    branches:
      - main  
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarqube:
    name: SonarQube Scan y Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  

     
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

     
      - name: Ejecutar Test y Cobertura
        run: npm test -- --coverage --watchAll=false

      
      - name: Normalizar rutas en lcov.info
        run: |
          sed -i 's|SF:.*Juego-del-Ahorcado/|SF:|g' coverage/lcov.info

      
      - name: Ejecutar análisis de SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      
      - name: Verificar Quality Gate (rompe si falla)
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}