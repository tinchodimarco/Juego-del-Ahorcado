name: Análisis Estático de Código (SonarQube)

on:
  push:
    branches:
      - main  
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarqube:
    name: SonarQube Scan y Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  

      
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

     
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-cov coverage

      
      - name: Ejecutar Test y Cobertura (Pytest)
        run: |
          pytest --cov=. --cov-report=xml:coverage.xml

      
      - name: Ejecutar análisis de SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      
      - name: Verificar Quality Gate (rompe si falla)
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}