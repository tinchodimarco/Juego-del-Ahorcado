name: CI/CD Pipeline - Ahorcado

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
  
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código del repositorio
      - name: Checkout del código
        uses: actions/checkout@v4

      # 2. Configurar Python
      - name: Configurar entorno de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # 3. Instalar dependencias
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Instalar navegadores para Playwright (necesario para los AT)
      - name: Instalar navegador Chromium para Playwright
        run: playwright install chromium

      # 5. Ejecutar Unit Tests y medir Cobertura (Exigiendo el umbral del 90% en el dominio)
      # Nota: Ajustá --cov=src según dónde tengas tu lógica de dominio
      - name: Ejecutar Unit Tests con Cobertura
        run: |
          pytest --cov=src --cov-fail-under=90 -v

      # 6. Ejecutar los Acceptance Tests con Behave
      - name: Ejecutar Acceptance Tests (ATs)
        run: |
          behave