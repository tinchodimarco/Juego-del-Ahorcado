name: CI/CD Pipeline - Ahorcado

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, master]

jobs:
  # Etapa 1: el proyecto se instala y compila desde cero
  build:
    name: 1 - Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compilar el codigo
        run: python -m compileall -q app.py src

  # Etapa 2: unit tests (si falla uno, se corta el pipeline)
  unit-tests:
    name: 2 - Unit tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Ejecutar unit tests
        run: pytest -v

  # Etapa 3: cobertura del dominio (src/) con umbral del 90%
  coverage:
    name: 3 - Coverage
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Medir cobertura (falla si baja del 90%)
        run: pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=90
      - name: Publicar reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  # Etapa 5: acceptance tests contra la app real en un navegador
  # (cuando se agregue el analisis estatico, este job pasa a depender de el)
  acceptance-tests:
    name: 5 - Acceptance tests
    needs: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Instalar Chromium para Playwright
        run: playwright install --with-deps chromium
      - name: Ejecutar acceptance tests
        run: behave



  # Etapa 6: deploy a produccion (solo si todo lo anterior paso, y solo en main)
  deploy:
    name: 6 - Deploy
    needs: acceptance-tests
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && github.repository == 'Martinvivas/ahorcado'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar Vercel CLI
        run: npm install --global vercel@latest
      - name: Desplegar a produccion
        run: vercel deploy --prod --yes --token="$VERCEL_TOKEN"