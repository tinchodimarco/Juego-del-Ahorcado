<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Juego del Ahorcado</title>
</head>

<body>
  <!-- Acá Flask inyecta la palabra enmascarada -->
  <h1 data-testid="word">{{ palabra }}</h1>

  <!-- Contador de intentos agregados para HU-03 -->
  <p>Intentos restantes: <span data-testid="intentos">{{ intentos }}</span></p>
  <p>Letras incorrectas: <span data-testid="letras-incorrectas">{{ letras_incorrectas }}</span></p>

{% if mensaje %}
 <p data-testid="mensaje-estado">{{ mensaje }}</p>
{% endif %}

  {% if aviso %}
  <p data-testid="aviso">{{ aviso }}</p>
  {% endif %}


  <!-- Formulario para enviar la letra por POST -->
  <form method="POST" action="/">
    <label for="letra">Ingresá una letra:</label>
    <input type="text" id="letra" name="letra" data-testid="letra-input"
      maxlength="1" required autocomplete="off" autofocus>
    <button type="submit" data-testid="adivinar-btn">Adivinar</button>
  </form>

  {% if mensaje %}
  <div class="acciones-fin-juego" style="margin-top: 20px;">
        <form action="/reiniciar" method="get">
            <button type="submit" class="btn-reiniciar">Reiniciar partida</button>
        </form>
    </div>
    {% endif %}

  <div data-testid="ahorcado-dibujo">
    <pre style="font-family: monospace; font-size: 1.2rem; line-height: 1.2;">{{ juego.obtener_dibujo() }}</pre>
  </div>


  <div style="margin-bottom: 15px;" data-testid="selector-dificultad">
    <p>Dificultad actual: <strong>{{ juego.dificultad }}</strong></p>
    <a href="/?dificultad=normal">
        <button type="button" data-testid="btn-normal">Normal</button>
    </a>
    <a href="/?dificultad=dificil">
        <button type="button" data-testid="btn-dificil">Difícil</button>
    </a>
</div>

</body>

</html>
