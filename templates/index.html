<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Juego del Ahorcado</title>
</head>

<body>
  <!-- Acá Flask inyecta la palabra enmascarada -->
  <h1 data-testid="word">{{ palabra }}</h1>

  <!-- Contador de intentos agregados para HU-03 -->
  <p>Intentos restantes: <span data-testid="intentos">{{ intentos }}</span></p>
  <p>Letras incorrectas: <span data-testid="letras-incorrectas">{{ letras_incorrectas }}</span></p>

{% if mensaje %}
 <p data-testid="mensaje-estado">{{ mensaje }}</p>
{% endif %}


  <!-- Formulario para enviar la letra por POST -->
  <form method="POST" action="/">
    <input type="text" name="letra" data-testid="letra-input" maxlength="1" autofocus>
    <button type="submit" data-testid="adivinar-btn">Adivinar</button>
  </form>
</body>

</html>
